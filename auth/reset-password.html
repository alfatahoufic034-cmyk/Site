<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe - ALFA IT SERVICES</title>

  <!-- CSS principal -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/reset-password.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Config Supabase -->
  <script defer src="../assets/js/supabaseClient.js"></script>

  <!-- JS Reset Password -->
  <script defer src="../assets/js/reset-password.js"></script>
</head>
<body>

  <section class="reset-page">

    <div class="reset-box">

      <!-- HEADER -->
      <div class="reset-header">
        <h1>Réinitialiser le mot de passe</h1>
        <p>
          Entrez votre nouveau mot de passe pour sécuriser
          votre compte ALFA IT SERVICES.
        </p>
      </div>

      <!-- FORM -->
      <form id="resetPasswordForm">

        <!-- Nouveau mot de passe -->
        <div class="form-group">
          <label for="newPassword">
            Nouveau mot de passe
          </label>
          <input
            type="password"
            id="newPassword"
            placeholder="Entrez votre nouveau mot de passe"
            required
          />
        </div>

        <!-- Confirmation -->
        <div class="form-group">
          <label for="confirmPassword">
            Confirmer le mot de passe
          </label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirmez votre mot de passe"
            required
          />
        </div>

        <!-- Bouton -->
        <button
          type="submit"
          class="btn-submit"
        >
          Réinitialiser le mot de passe
        </button>

        <!-- Message -->
        <p
          id="message"
          class="message"
        ></p>

      </form>

      <!-- Retour -->
      <div class="back-login">
        <a href="login.html">
          ← Retour à la connexion
        </a>
      </div>

    </div>

  </section>

</body>
</html>
