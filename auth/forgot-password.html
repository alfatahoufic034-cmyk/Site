<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié - ALFA IT SERVICE</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/forgot-password.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Config Supabase -->
  <script defer src="../assets/js/supabaseClient.js"></script>

  <!-- JS Forgot Password -->
  <script defer src="../assets/js/forgot-password.js"></script>
</head>
<body>

  <section class="forgot-page">

    <div class="forgot-box">

      <div class="forgot-header">
        <h1>Mot de passe oublié</h1>
        <p>
          Entrez votre adresse email pour recevoir un lien
          de réinitialisation de mot de passe.
        </p>
      </div>

      <form id="forgotPasswordForm">

        <!-- EMAIL -->
        <div class="form-group">
          <label for="email">Adresse Email</label>
          <input
            type="email"
            id="email"
            placeholder="exemple@email.com"
            required
          />
        </div>

        <!-- BOUTON -->
        <button
          type="submit"
          class="btn-submit"
        >
          Envoyer le lien
        </button>

        <!-- MESSAGE -->
        <p
          id="message"
          class="message"
        ></p>

      </form>

      <!-- RETOUR LOGIN -->
      <div class="back-login">
        <a href="login.html">
          ← Retour à la connexion
        </a>
      </div>

    </div>

  </section>

</body>
</html>
