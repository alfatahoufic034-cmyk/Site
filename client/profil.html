<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Profil - ALFA IT SERVICES</title>

  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="icon" href="data:," />

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="client-dashboard-page">

  <div class="dashboard-wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h2>ALFA IT</h2>
        <p>Client Space</p>
      </div>

      <nav class="sidebar-menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="../demande.html">Nouvelle demande</a>
        <a href="demandes.html">Mes demandes</a>
        <a href="historique.html">Historique</a>
        <a href="../avis.html">Avis & Suggestions</a>
        <a href="#" id="logoutBtn">Déconnexion</a>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="dashboard-content">

      <!-- HEADER -->
      <section class="dashboard-header">
        <h1>Mon Profil</h1>
        <p>Consultez et mettez à jour vos informations personnelles</p>
      </section>

      <!-- PROFILE FORM -->
      <section class="form-section">
        <form id="profileForm">

          <div class="form-group">
            <label>Nom</label>
            <input type="text" id="nom" required />
          </div>

          <div class="form-group">
            <label>Prénom</label>
            <input type="text" id="prenom" required />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" readonly />
          </div>

          <div class="form-group">
            <label>Téléphone</label>
            <input type="tel" id="phone" required />
          </div>

          <div class="form-group">
            <label>Type de compte</label>
            <input type="text" id="role" readonly />
          </div>

          <button type="submit" class="btn btn-gold">
            Mettre à jour le profil
          </button>

          <p id="profileMessage" class="success-message"></p>

        </form>
      </section>

    </main>
  </div>

  <!-- SCRIPTS -->
  <script src="../assets/js/supabaseClient.js"></script>
  <script src="../assets/js/profil.js"></script>
</body>
</html>
