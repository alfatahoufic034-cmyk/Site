<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inscription - ALFA IT SERVICE</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">

  <!-- Favicon -->
  <link rel="icon" href="data:,">

  <!-- SUPABASE CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="register-page">

  <div class="login-container">
    <div class="login-box">

      <h2>ALFA IT SERVICE</h2>
      <p class="login-subtitle">Créer un compte</p>

      <!-- FORMULAIRE -->
      <form id="registerForm" autocomplete="on">

        <!-- NOM -->
        <div class="input-group">
          <label for="nom">Nom</label>
          <input
            type="text"
            id="nom"
            name="nom"
            placeholder="Ex: Kossi"
            autocomplete="family-name"
            required
          >
        </div>

        <!-- PRENOM -->
        <div class="input-group">
          <label for="prenom">Prénom</label>
          <input
            type="text"
            id="prenom"
            name="prenom"
            placeholder="Ex: Mensah"
            autocomplete="given-name"
            required
          >
        </div>

        <!-- EMAIL -->
        <div class="input-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Ex: kossi@gmail.com"
            autocomplete="email"
            required
          >
        </div>

        <!-- TELEPHONE -->
        <div class="input-group">
          <label for="phone">Téléphone</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="+228 90 12 34 56"
            autocomplete="tel"
            required
          >
        </div>

        <!-- PASSWORD -->
        <div class="input-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            required
          >

          <div id="passwordStrengthContainer" style="margin-top:8px;">
  <div style="height:6px; background:#333; border-radius:5px; overflow:hidden;">
    <div id="passwordStrengthBar" style="height:6px; width:0%; background:red; transition:0.3s;"></div>
  </div>

  <small id="passwordStrengthText" style="color:#aaa;">
    Force du mot de passe
  </small>
</div>

          <!-- 🔐 AJOUT IMPORTANT -->
          <small id="passwordRules" style="color:#999; font-size:12px; display:block; margin-top:5px;">
            🔐 Minimum 8 caractères, lettres + chiffres + 1 symbole (@, #, $, etc.)
          </small>
        </div>
        

        <!-- CONFIRM PASSWORD -->
        <div class="input-group">
          <label for="confirmPassword">Confirmer mot de passe</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            autocomplete="new-password"
            required
          >
        </div>

        <!-- MESSAGE -->
        <p id="registerMsg"></p>

        <!-- INFO -->
        <p style="font-size:12px; color:#666; text-align:center; margin-bottom:10px;">
          🔒 Vos informations sont sécurisées
        </p>

        <!-- BOUTON -->
        <button type="submit" class="btn login-btn">
          Créer un compte
        </button>

      </form>

      <!-- LOGIN -->
      <p class="login-footer">
        Déjà un compte ?
        <a href="login.html">Se connecter</a>
      </p>

    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="../assets/js/supabaseClient.js"></script>
  <script src="../assets/js/register.js"></script>

</body>
</html>
