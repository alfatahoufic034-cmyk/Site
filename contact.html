<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - ALFA IT SERVICE</title>

  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabaseClient.js"></script>
<script defer src="assets/js/contact.js"></script>
</head>

<body>

<!-- ===== NAVBAR ===== -->
<header class="navbar">
  <div class="logo">
    <img src="assets/images/logo.png">
    <h1>ALFA IT SERVICES</h1>
  </div>
</header>

<!-- ===== HERO ===== -->
</section>

<section class="contact-section">
  <div class="container">
    <div class="contact-grid">

      <div class="contact-form">
        <h2>Envoyez-nous un message</h2>
        <form id="contactForm">
          <div class="form-group">
            <label>Nom</label>
            <input type="text" id="nom" placeholder="Votre nom" required />
          </div>

          <div class="form-group">
            <label>Prénom</label>
            <input type="text" id="prenom" placeholder="Votre prénom" required />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="exemple@email.com" required />
          </div>

          <div class="form-group">
            <label>Téléphone</label>
            <input type="tel" id="contact" placeholder="+228 90 00 00 00" required />
          </div>

          <div class="form-group">
            <label>Message</label>
            <textarea id="messageText" rows="5" placeholder="Écrivez votre message ici..." required></textarea>
          </div>

          <button type="submit" class="btn-submit">Envoyer le message</button>
          <div id="messageBox" class="message"></div>
        </form>
      </div>

      <div class="contact-info">
        <h2>Nos coordonnées</h2>
        <ul>
          <li><strong>Entreprise :</strong> ALFA-IT-SERVICES</li>
          <li><strong>Lieu :</strong> Quartier …, Kara</li>
          <li><strong>Ville :</strong> Kara, Togo</li>
          <li><strong>Contact :</strong> +228 90 00 00 00 / +228 00 00 00 00</li>
          <li><strong>Email :</strong> contact@alfaitsolution.com</li>
          <li><strong>Heures :</strong> Lun – Sam : 7h30 à 18h30</li>
        </ul>
      </div>

    </div>
  </div>
</section>


</body>
</html>
