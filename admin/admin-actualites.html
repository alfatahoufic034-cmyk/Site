<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Actualités</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- TON CONFIG SUPABASE -->
  <script defer src="../assets/js/supabaseclient.js"></script>

  <!-- JS ADMIN ACTUALITÉS -->
  <script defer src="../assets/js/admin-actualites.js"></script>

  <style>
    body{
      margin:0;
      font-family:Poppins, sans-serif;
      background:#0b0b0b;
      color:#fff;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    h1{
      text-align:center;
      color:#d4af37;
      margin-bottom:20px;
    }

    /* FORM */
    .form-box{
      background:#111;
      padding:20px;
      border-radius:12px;
      border:1px solid #222;
      margin-bottom:30px;
    }

    input, textarea{
      width:100%;
      padding:12px;
      margin:8px 0;
      border-radius:8px;
      border:none;
      background:#1a1a1a;
      color:#fff;
      outline:none;
    }

    textarea{
      min-height:150px;
      resize:none;
    }

    button{
      background:#d4af37;
      color:#000;
      padding:12px 18px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
      margin-top:10px;
    }

    button:hover{
      opacity:0.9;
    }

    /* LIST */
    .list{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .card{
      background:#111;
      border:1px solid #222;
      padding:15px;
      border-radius:10px;
    }

    .card h3{
      margin:0;
      color:#d4af37;
    }

    .card p{
      color:#ccc;
      margin:5px 0;
    }

    .actions{
      margin-top:10px;
      display:flex;
      gap:10px;
    }

    .edit{
      background:#333;
      color:#fff;
    }

    .delete{
      background:red;
      color:#fff;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>📢 Gestion des Actualités</h1>

  <!-- FORMULAIRE -->
  <div class="form-box">

    <input type="hidden" id="id">

    <input type="text" id="titre" placeholder="Titre de l'article">

    <input type="text" id="categorie" placeholder="Catégorie (ex: sécurité, IT...)">

    <textarea id="contenu" placeholder="Contenu de l'article"></textarea>

    <button id="saveBtn">Publier</button>

  </div>

  <!-- LISTE -->
  <div class="list" id="list">
    <!-- articles ici -->
  </div>

</div>

</body>
</html>
